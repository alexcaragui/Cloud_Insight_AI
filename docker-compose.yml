services:
  clickhouse:
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_USER: core-ch
      CLICKHOUSE_PASSWORD: core-ch
      CLICKHOUSE_DB: core
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  ollama:
    image: ollama/ollama
    command: ["serve"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  model-downloader:
    image: ollama/ollama
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "until ollama pull qwen2.5:7b; do
         echo '[model-downloader] retrying qwen2.5:7b...'; sleep 5;
       done &&
       until ollama pull nomic-embed-text:latest; do
         echo '[model-downloader] retrying nomic-embed-text...'; sleep 5;
       done &&
       echo '[model-downloader] all models ready.'"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  # ────── BE ───────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      MODULE_REGISTRY_URLS: http://cloud-insight-ai:80,http://anomascan:80,http://bots-trader-platform:80,http://spin-docs:80
      CLICKHOUSE_URL: clickhouse://core-ch:core-ch@clickhouse:9000/core
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app_data:/app/data
      - ./models:/app/models:ro
    depends_on:
      ollama:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # ────── FE (prod) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ────── FE (dev — npm start with hot reload) ──────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      REACT_APP_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    profiles:
      - dev

volumes:
  clickhouse_data:
  app_data:
  frontend_node_modules:
